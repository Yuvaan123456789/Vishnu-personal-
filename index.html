<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyInsta - Vishnu Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="navbar">
    <div class="logo">📸 MyInsta</div>
    <input type="text" placeholder="Search..." class="search-box">

    <button onclick="toggleDarkMode()" class="dark-btn">
        🌙 Dark Mode
    </button>
</div>

    <div class="header">
        <h1>📸 Vishnu Family Gallery</h1>
        <p>My Personal Photo Collection</p>
    </div>

    <div class="gallery">

        <div class="post">
            <div class="post-header">👤 Vishnu Family</div>
            <img src="./Screenshot 2026-05-05 080214.png" onclick="openImage(this)">
            <div class="actions">
                <button onclick="like(this)">❤️ Like</button>
                <span class="likes">0 likes</span>
            </div>
        </div>

        <div class="post">
            <div class="post-header">👤 Vishnu Family</div>
            <img src="./Screenshot 2026-05-05 081240.png" onclick="openImage(this)">
            <div class="actions">
                <button onclick="like(this)">❤️ Like</button>
                <span class="likes">0 likes</span>
            </div>
        </div>

        <div class="post">
            <div class="post-header">👤 Vishnu Family</div>
            <img src="./Screenshot 2026-05-05 081923.png" onclick="openImage(this)">
            <div class="actions">
                <button onclick="like(this)">❤️ Like</button>
                <span class="likes">0 likes</span>
            </div>
        </div>

        <div class="post">
            <div class="post-header">👤 Vishnu Family</div>
            <img src="./Screenshot 2026-05-05 082106.png" onclick="openImage(this)">
            <div class="actions">
                <button onclick="like(this)">❤️ Like</button>
                <span class="likes">0 likes</span>
            </div>
        </div>

    </div>

    <div id="modal" onclick="closeImage()">
        <img id="modalImg">
    </div>

    <script src="script.js"></script>

</body>
</html>
